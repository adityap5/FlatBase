version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: hotel-booking-backend
    restart: unless-stopped
    ports:
      - '5000:5000'
    env_file:
      - .env
    environment:
      - NODE_ENV=production
    volumes:
      # Persist uploaded files across container restarts
      - uploads_data:/app/uploads
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://localhost:5000/graphql']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  uploads_data:
    driver: local
